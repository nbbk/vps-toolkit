name: Signed release install
on:
  workflow_run:
    workflows: [Release assets]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            prepare: apt-get update && apt-get install -y bash curl ca-certificates tar coreutils
          - image: rockylinux:9
            prepare: dnf install -y bash curl ca-certificates tar gzip coreutils
          - image: alpine:3.20
            prepare: apk add --no-cache bash curl ca-certificates tar coreutils
    steps:
      - name: Verify one-line signed installation on ${{ matrix.image }}
        run: >-
          docker run --rm
          ${{ matrix.image }}
          bash -lc 'set -Eeuo pipefail;
          ${{ matrix.prepare }};
          curl -fsSL https://raw.githubusercontent.com/nbbk/vps-toolkit/main/bootstrap.sh | bash;
          test -x /opt/vps-toolkit/vps-tool.sh;
          test -s /opt/vps-toolkit/config/release-signing-public.pem;
          version="$(vps-tool version)";
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]];
          printf "signed install: PASS (%s)\n" "$version"'
